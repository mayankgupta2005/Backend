services:
  - type: web
    name: novashields-backend
    env: python
    plan: free # Can be updated to starter, standard, etc. if required
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: novashields
      - key: CORS_ORIGINS
        value: "*"
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        sync: false
