services:
  - type: web
    name: novashields-backend
    env: python
    plan: free # Can be updated to starter, standard, etc. if required
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        placeholder: "Enter MongoDB connection URI or 'mock' to run mock DB"
      - key: DB_NAME
        value: novashields
      - key: CORS_ORIGINS
        value: "*"
      - key: EMERGENT_LLM_KEY
        placeholder: "Enter Claude Anthropic LLM API Key (optional)"
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        placeholder: "Enter Firebase service account json path (optional)"
